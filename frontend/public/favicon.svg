<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Theme Palette Gradient: Primary Blue (#2563EB) to Cyan (#06B6D4) -->
    <linearGradient id="themeShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Glass Overlay -->
    <linearGradient id="glassOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Shield Body -->
  <path d="M 256, 32 C 344, 32 432, 72 432, 112 C 432, 264 368, 416 256, 480 C 144, 416 80, 264 80, 112 C 80, 72 168, 32 256, 32 Z" 
        fill="url(#themeShieldGrad)" />

  <!-- Glossy Upper Curve -->
  <path d="M 256, 48 C 334, 48 414, 84 414, 118 C 414, 252 356, 390 256, 452 C 156, 390 98, 252 98, 118 C 98, 84 178, 48 256, 48 Z" 
        fill="url(#glassOverlay)" />

  <!-- Inner Shield Accent Line -->
  <path d="M 256, 92 C 314, 92 374, 118 374, 144 C 374, 248 328, 356 256, 408 C 184, 356 138, 248 138, 144 C 138, 118 198, 92 256, 92 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85" />

  <!-- Centered Check / Safety Emblem -->
  <path d="M 200, 248 L 242, 290 L 316, 204" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
